version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
    environment:
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - DATABASE_URL=sqlite:///./burme.db

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend